# Update Tables Loop   
resources:
  jobs:
    update_tables_loop:
      name: Update tables using foreach loop

      schedule:
        quartz_cron_expression: 0 15 09 * * ?
        timezone_id: PST 
        pause_status: UNPAUSED
      max_concurrent_runs: 4

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      tasks:
        - task_key: encounter_stg_update
          notebook_task:
            notebook_path: ../../src/encounter_stg_update.sql
            base_parameters:
              lookback_mins: 15 

#       - task_key: get_views
#         notebook_task:
#           notebook_path: ../../src/get_views.py
#         depends_on:
#           - task_key: encounter_stg_update

        - task_key: update_tables_json
          depends_on:
            - task_key: encounter_stg_update
          for_each_task:
            inputs: '[
              {"table_name": "lab", "lookback_mins": 5}, 
              {"table_name": "vital_signs", "lookback_mins": 10}
            ]'
 #           inputs:
 #             json_file_path:
 #               type: str
 #               description: "Path to the input JSON configuration file." 
 #               default: "path/to/default_config.json"
            task:
              task_key: update_tables_json_iteration
              notebook_task:
                notebook_path: ../../src/update_tables_sql.sql
                base_parameters:
                  table_name: "{{input.table_name}}"
                  lookback_mins: "{{input.lookback_mins}}"
            concurrency: 4

#       - task_key: update_tables
#         depends_on:
#           - task_key: get_views
#         for_each_task:
#           inputs: "{{tasks.get_views.values.table_names}}"
#           concurrency: 4
#           task:
#             task_key: update_tables_iteration
#             notebook_task:
#               notebook_path: ../../src/update_tables_sql.sql
#               base_parameters:
#                 table_name: "{{input}}"
#               source: WORKSPACE

      queue:
        enabled: true

